<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>U-Move Logo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #d8dce6; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 60px; gap: 32px; font-family: -apple-system, sans-serif; }
    h1 { font-size: 12px; color: #888; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
    h2 { font-size: 11px; color: #aaa; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
    .sizes { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .size-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .size-label { font-size: 10px; color: #aaa; letter-spacing: 0.05em; text-transform: uppercase; }
    .variants { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 380px; }
    .vcard { background: #fff; border-radius: 16px; padding: 20px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .vlabel { font-size: 10px; color: #aaa; letter-spacing: 0.06em; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>U-Move Logo</h1>

  <!-- MAIN DESIGN AT MULTIPLE SIZES -->
  <div class="sizes">

    <!-- 180x180 App Icon -->
    <div class="size-col">
      <svg width="180" height="180" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rg_main" x1="-10" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1976D2"/>
            <stop offset="45%" stop-color="#00BCD4"/>
            <stop offset="100%" stop-color="#4CAF50"/>
          </linearGradient>
          <filter id="rshadow" x="-20%" y="-50%" width="140%" height="200%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000030"/>
          </filter>
          <filter id="pshadow" x="-40%" y="-5%" width="180%" height="120%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#00000040"/>
          </filter>
        </defs>
        <!-- Background -->
        <rect width="200" height="200" rx="44" fill="#f1f1f6"/>
        <!-- U arch (behind ribbon) -->
        <path d="M52,132 L52,156 Q52,184 100,184 Q148,184 148,156 L148,132 L130,132 L130,156 Q130,168 100,168 Q70,168 70,156 L70,132 Z" fill="#2E3A4E"/>
        <!-- Ribbon — M-wave, gradient, weaves behind posts -->
        <path d="M -10,94 C 10,92 32,91 52,90 C 57,90 63,89 70,88 C 74,87 79,68 86,63 C 88,62 98,84 100,84 C 102,84 112,62 114,63 C 121,68 126,87 130,88 C 137,89 143,90 148,90 C 168,91 190,92 210,94"
              stroke="url(#rg_main)" stroke-width="24" stroke-linecap="butt" fill="none" filter="url(#rshadow)"/>
        <!-- Left post (in front of ribbon — creates weave effect) -->
        <rect x="52" y="20" width="18" height="114" fill="#2E3A4E" filter="url(#pshadow)"/>
        <rect x="36" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
        <!-- Right post -->
        <rect x="130" y="20" width="18" height="114" fill="#2E3A4E" filter="url(#pshadow)"/>
        <rect x="114" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
      </svg>
      <div class="size-label">App Icon</div>
    </div>

    <!-- 100x100 -->
    <div class="size-col">
      <svg width="100" height="100" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rg_med" x1="-10" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1976D2"/>
            <stop offset="45%" stop-color="#00BCD4"/>
            <stop offset="100%" stop-color="#4CAF50"/>
          </linearGradient>
        </defs>
        <rect width="200" height="200" rx="44" fill="#f1f1f6"/>
        <path d="M52,132 L52,156 Q52,184 100,184 Q148,184 148,156 L148,132 L130,132 L130,156 Q130,168 100,168 Q70,168 70,156 L70,132 Z" fill="#2E3A4E"/>
        <path d="M -10,94 C 10,92 32,91 52,90 C 57,90 63,89 70,88 C 74,87 79,68 86,63 C 88,62 98,84 100,84 C 102,84 112,62 114,63 C 121,68 126,87 130,88 C 137,89 143,90 148,90 C 168,91 190,92 210,94"
              stroke="url(#rg_med)" stroke-width="24" stroke-linecap="butt" fill="none"/>
        <rect x="52" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="36" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
        <rect x="130" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="114" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
      </svg>
      <div class="size-label">Medium</div>
    </div>

    <!-- 60x60 -->
    <div class="size-col">
      <svg width="60" height="60" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rg_sm" x1="-10" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1976D2"/>
            <stop offset="45%" stop-color="#00BCD4"/>
            <stop offset="100%" stop-color="#4CAF50"/>
          </linearGradient>
        </defs>
        <rect width="200" height="200" rx="44" fill="#f1f1f6"/>
        <path d="M52,132 L52,156 Q52,184 100,184 Q148,184 148,156 L148,132 L130,132 L130,156 Q130,168 100,168 Q70,168 70,156 L70,132 Z" fill="#2E3A4E"/>
        <path d="M -10,94 C 10,92 32,91 52,90 C 57,90 63,89 70,88 C 74,87 79,68 86,63 C 88,62 98,84 100,84 C 102,84 112,62 114,63 C 121,68 126,87 130,88 C 137,89 143,90 148,90 C 168,91 190,92 210,94"
              stroke="url(#rg_sm)" stroke-width="24" stroke-linecap="butt" fill="none"/>
        <rect x="52" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="36" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
        <rect x="130" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="114" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
      </svg>
      <div class="size-label">Small</div>
    </div>

    <!-- 44x44 Widget -->
    <div class="size-col">
      <svg width="44" height="44" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rg_xs" x1="-10" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1976D2"/>
            <stop offset="45%" stop-color="#00BCD4"/>
            <stop offset="100%" stop-color="#4CAF50"/>
          </linearGradient>
        </defs>
        <rect width="200" height="200" rx="44" fill="#f1f1f6"/>
        <path d="M52,132 L52,156 Q52,184 100,184 Q148,184 148,156 L148,132 L130,132 L130,156 Q130,168 100,168 Q70,168 70,156 L70,132 Z" fill="#2E3A4E"/>
        <path d="M -10,94 C 10,92 32,91 52,90 C 57,90 63,89 70,88 C 74,87 79,68 86,63 C 88,62 98,84 100,84 C 102,84 112,62 114,63 C 121,68 126,87 130,88 C 137,89 143,90 148,90 C 168,91 190,92 210,94"
              stroke="url(#rg_xs)" stroke-width="24" stroke-linecap="butt" fill="none"/>
        <rect x="52" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="36" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
        <rect x="130" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="114" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
      </svg>
      <div class="size-label">Widget</div>
    </div>
  </div>

  <h2>Color Variants</h2>

  <div class="variants">

    <!-- Variant: Blue → Purple -->
    <div class="vcard">
      <svg width="90" height="90" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rg_v1" x1="-10" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1565C0"/>
            <stop offset="50%" stop-color="#7B1FA2"/>
            <stop offset="100%" stop-color="#E91E63"/>
          </linearGradient>
        </defs>
        <rect width="200" height="200" rx="44" fill="#f1f1f6"/>
        <path d="M52,132 L52,156 Q52,184 100,184 Q148,184 148,156 L148,132 L130,132 L130,156 Q130,168 100,168 Q70,168 70,156 L70,132 Z" fill="#2E3A4E"/>
        <path d="M -10,94 C 10,92 32,91 52,90 C 57,90 63,89 70,88 C 74,87 79,68 86,63 C 88,62 98,84 100,84 C 102,84 112,62 114,63 C 121,68 126,87 130,88 C 137,89 143,90 148,90 C 168,91 190,92 210,94"
              stroke="url(#rg_v1)" stroke-width="24" stroke-linecap="butt" fill="none"/>
        <rect x="52" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="36" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
        <rect x="130" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="114" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
      </svg>
      <span class="vlabel">Blue → Pink</span>
    </div>

    <!-- Variant: Orange → Yellow -->
    <div class="vcard">
      <svg width="90" height="90" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rg_v2" x1="-10" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#E53935"/>
            <stop offset="50%" stop-color="#FF7043"/>
            <stop offset="100%" stop-color="#FFB300"/>
          </linearGradient>
        </defs>
        <rect width="200" height="200" rx="44" fill="#f1f1f6"/>
        <path d="M52,132 L52,156 Q52,184 100,184 Q148,184 148,156 L148,132 L130,132 L130,156 Q130,168 100,168 Q70,168 70,156 L70,132 Z" fill="#2E3A4E"/>
        <path d="M -10,94 C 10,92 32,91 52,90 C 57,90 63,89 70,88 C 74,87 79,68 86,63 C 88,62 98,84 100,84 C 102,84 112,62 114,63 C 121,68 126,87 130,88 C 137,89 143,90 148,90 C 168,91 190,92 210,94"
              stroke="url(#rg_v2)" stroke-width="24" stroke-linecap="butt" fill="none"/>
        <rect x="52" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="36" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
        <rect x="130" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="114" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
      </svg>
      <span class="vlabel">Red → Gold</span>
    </div>

    <!-- Variant: Dark bg, gold ribbon -->
    <div class="vcard">
      <svg width="90" height="90" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rg_v3" x1="-10" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFB300"/>
            <stop offset="50%" stop-color="#FFD54F"/>
            <stop offset="100%" stop-color="#FFB300"/>
          </linearGradient>
        </defs>
        <rect width="200" height="200" rx="44" fill="#0A1F44"/>
        <path d="M52,132 L52,156 Q52,184 100,184 Q148,184 148,156 L148,132 L130,132 L130,156 Q130,168 100,168 Q70,168 70,156 L70,132 Z" fill="white"/>
        <path d="M -10,94 C 10,92 32,91 52,90 C 57,90 63,89 70,88 C 74,87 79,68 86,63 C 88,62 98,84 100,84 C 102,84 112,62 114,63 C 121,68 126,87 130,88 C 137,89 143,90 148,90 C 168,91 190,92 210,94"
              stroke="url(#rg_v3)" stroke-width="24" stroke-linecap="butt" fill="none"/>
        <rect x="52" y="20" width="18" height="114" fill="white"/>
        <rect x="36" y="20" width="50" height="13" rx="3" fill="white"/>
        <rect x="130" y="20" width="18" height="114" fill="white"/>
        <rect x="114" y="20" width="50" height="13" rx="3" fill="white"/>
      </svg>
      <span class="vlabel">Navy + Gold</span>
    </div>

    <!-- Variant: Teal mono -->
    <div class="vcard">
      <svg width="90" height="90" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rg_v4" x1="-10" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#006064"/>
            <stop offset="50%" stop-color="#00BCD4"/>
            <stop offset="100%" stop-color="#006064"/>
          </linearGradient>
        </defs>
        <rect width="200" height="200" rx="44" fill="#f1f1f6"/>
        <path d="M52,132 L52,156 Q52,184 100,184 Q148,184 148,156 L148,132 L130,132 L130,156 Q130,168 100,168 Q70,168 70,156 L70,132 Z" fill="#2E3A4E"/>
        <path d="M -10,94 C 10,92 32,91 52,90 C 57,90 63,89 70,88 C 74,87 79,68 86,63 C 88,62 98,84 100,84 C 102,84 112,62 114,63 C 121,68 126,87 130,88 C 137,89 143,90 148,90 C 168,91 190,92 210,94"
              stroke="url(#rg_v4)" stroke-width="24" stroke-linecap="butt" fill="none"/>
        <rect x="52" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="36" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
        <rect x="130" y="20" width="18" height="114" fill="#2E3A4E"/>
        <rect x="114" y="20" width="50" height="13" rx="3" fill="#2E3A4E"/>
      </svg>
      <span class="vlabel">Teal Mono</span>
    </div>

  </div>
</body>
</html>
